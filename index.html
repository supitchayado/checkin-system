<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Pro Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; }
        .tabs { display: flex; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; font-weight: bold; cursor: pointer; color: #555; }
        .tab-btn.active { color: #007bff; border-bottom: 3px solid #007bff; }
        .container { padding: 20px; max-width: 800px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 1.2rem; box-sizing: border-box; margin: 15px 0; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:disabled { background: #ccc !important; cursor: not-allowed; }
        .bay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .bay { padding: 15px 5px; border-radius: 8px; text-align: center; border: 1px solid #eee; font-size: 0.9rem; }
        .busy { background: #fff1f0; color: #f5222d; border-color: #ffa39e; }
        .free { background: #f6ffed; color: #52c41a; border-color: #b7eb8f; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 15px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: left; }
        th { background: #fafafa; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="tabs">
    <button class="tab-btn active" onclick="showPage('entry')">1.ลงทะเบียน</button>
    <button class="tab-btn" onclick="showPage('load')">2.เริ่มโหลด</button>
    <button class="tab-btn" onclick="showPage('exit')">3.ทางออก</button>
    <button class="tab-btn" onclick="showPage('dash')">📊 รายงาน</button>
</div>

<div class="container">
    <div id="p-entry" class="card">
        <h2 style="text-align:center;">🚛 ลงทะเบียนรถเข้า</h2>
        <input type="number" id="tripNo" placeholder="กรอกเลข Trip" inputmode="numeric">
        <button id="btn-entry" class="btn" style="background:#007bff; color:white;" onclick="doAction('Entry')">ออกคิวทันที</button>
    </div>

    <div id="p-load" class="card hidden">
        <h2 style="text-align:center;">📦 เริ่มโหลดสินค้า</h2>
        <input type="number" id="queNo" placeholder="เลขคิว">
        <button id="btn-load" class="btn" style="background:#52c41a; color:white;" onclick="doAction('Load-Start')">เริ่มโหลด</button>
    </div>

    <div id="p-exit" class="card hidden">
        <h2 style="text-align:center;">🏁 บันทึกทางออก</h2>
        <p style="text-align:center; font-size:0.9rem; color:#888;">คลิกเลือก Trip ที่ต้องการให้ออก:</p>
        <div id="exitGrid" class="bay-grid"></div>
    </div>

    <div id="p-dash" class="card hidden">
        <h2 style="text-align:center;">📊 สรุปผลวันนี้</h2>
        <div style="display:flex; justify-content:space-around; text-align:center; margin-bottom:20px;">
            <div><small>รอ</small><br><b id="s-wait">0</b></div>
            <div><small>โหลด</small><br><b id="s-load">0</b></div>
            <div><small>เสร็จ</small><br><b id="s-out">0</b></div>
            <div><small>สาย</small><br><b id="s-delay" style="color:red">0</b></div>
        </div>

        <h3>⚠️ รถเข้าโหลดล่าช้า (Delay)</h3>
        <div style="overflow-x:auto;">
            <table id="delayTable">
                <thead>
                    <tr>
                        <th>Trip No.</th>
                        <th>คนขับ</th>
                        <th>เบอร์โทร</th>
                        <th>SUB</th>
                        <th>ทะเบียน</th>
                        <th>แผน</th>
                    </tr>
                </thead>
                <tbody id="delayBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycby3j6gpNCushFzMl_pjgHCVHeMnbRXh6j-cmAy5phCn19fdBOuq6XLBTQBWd7IhnZfMaw/exec";

    function showPage(p) {
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('p-'+p).classList.remove('hidden');
        event.currentTarget.classList.add('active');
        if(p === 'dash' || p === 'exit') refreshData(p);
    }

    async function refreshData(page) {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        if(page === 'dash') {
            document.getElementById('s-wait').innerText = data.waiting;
            document.getElementById('s-load').innerText = data.loading;
            document.getElementById('s-out').innerText = data.completed;
            document.getElementById('s-delay').innerText = data.delays.length;
            
            let html = "";
            data.delays.forEach(d => {
                html += `<tr><td>${d.trip}</td><td>${d.driver}</td><td>${d.phone}</td><td>${d.sub}</td><td>${d.vehicle}</td><td>${d.time}</td></tr>`;
            });
            document.getElementById('delayBody').innerHTML = html || "<tr><td colspan='6' style='text-align:center'>ไม่มีรถสาย</td></tr>";
        }

        const grid = document.getElementById('exitGrid');
        if(page === 'exit') {
            grid.innerHTML = "";
            for(let i=1; i<=18; i++) {
                const trip = data.bays[i];
                const div = document.createElement('div');
                div.className = `bay ${trip ? 'busy' : 'free'}`;
                div.innerHTML = `ช่อง ${i}<br><b>${trip || 'ว่าง'}</b>`;
                if(trip) div.onclick = () => doAction('Exit', i);
                grid.appendChild(div);
            }
        }
    }

    async function doAction(act, val) {
        // ป้องกันการกดซ้ำ
        const btn = act === 'Entry' ? document.getElementById('btn-entry') : document.getElementById('btn-load');
        if(btn) { btn.disabled = true; btn.innerText = "กำลังประมวลผล..."; }

        let p = { action: act };
        if(act==='Entry') p.tripNo = document.getElementById('tripNo').value;
        if(act==='Load-Start') p.queNo = document.getElementById('queNo').value;
        if(act==='Exit') p.bayNo = val;

        try {
            const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(p) });
            const msg = await r.text();
            alert(msg);
            location.reload();
        } catch(e) {
            alert("เกิดข้อผิดพลาด: " + e);
            if(btn) { btn.disabled = false; btn.innerText = "ลองอีกครั้ง"; }
        }
    }
</script>
</body>
</html>
