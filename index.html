<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">
    <nav class="bg-white border-b sticky top-0 z-50 flex justify-around p-4 shadow-sm text-sm font-semibold text-slate-600">
        <button onclick="tab('entry')" id="t-entry" class="text-blue-600 border-b-2 border-blue-600 pb-1">ลงทะเบียน</button>
        <button onclick="tab('dash')" id="t-dash">รายงาน</button>
    </nav>

    <div class="p-4 max-w-lg mx-auto">
        <div id="p-entry" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-xl font-bold text-center mb-6">🚛 ลงทะเบียนรถเข้า</h2>
            <input id="tripInput" type="text" class="w-full border-2 border-slate-200 p-4 rounded-xl text-center text-2xl mb-4 focus:border-blue-500 outline-none" placeholder="กรอกเลข Trip">
            <button onclick="send()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-xl font-bold text-lg transition-all shadow-md active:scale-95">ออกคิว</button>
        </div>

        <div id="p-dash" class="hidden space-y-4">
            <div class="grid grid-cols-4 gap-2 text-center bg-white p-4 rounded-2xl shadow-sm border">
                <div><p class="text-[10px] text-slate-400">รอ</p><b id="s-w" class="text-lg">0</b></div>
                <div><p class="text-[10px] text-slate-400">โหลด</p><b id="s-l" class="text-lg">0</b></div>
                <div><p class="text-[10px] text-slate-400">เสร็จ</p><b id="s-c" class="text-lg">0</b></div>
                <div><p class="text-[10px] text-slate-400">สาย</p><b id="s-d" class="text-lg text-red-500">0</b></div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <table class="w-full text-xs text-left">
                    <thead class="bg-slate-50 text-slate-500"><tr class="border-b">
                        <th class="p-3">Trip</th><th class="p-3 text-center">ทะเบียน</th><th class="p-3 text-right">แผน</th>
                    </tr></thead>
                    <tbody id="delayList" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbwOrDT5abnlnvDWKeV5Ex2M5T3H0PtAz8YJz-KqO60nWh7Di8b5h2i48GrKe2sNU_G-YQ/exec"; // *** เปลี่ยนตรงนี้ ***

        function tab(name) {
            document.getElementById('p-entry').classList.toggle('hidden', name !== 'entry');
            document.getElementById('p-dash').classList.toggle('hidden', name !== 'dash');
            document.getElementById('t-entry').className = name === 'entry' ? 'text-blue-600 border-b-2 border-blue-600 pb-1' : '';
            document.getElementById('t-dash').className = name === 'dash' ? 'text-blue-600 border-b-2 border-blue-600 pb-1' : '';
            if(name === 'dash') update();
        }

        async function update() {
            const r = await fetch(API);
            const d = await r.json();
            document.getElementById('s-w').innerText = d.waiting;
            document.getElementById('s-l').innerText = d.loading;
            document.getElementById('s-c').innerText = d.completed;
            document.getElementById('s-d').innerText = d.delays.length;
            document.getElementById('delayList').innerHTML = d.delays.map(x => `
                <tr><td class="p-3 font-semibold">${x.trip}</td><td class="p-3 text-center">${x.vehicle}</td><td class="p-3 text-right text-red-500">${x.time}</td></tr>
            `).join('');
        }

        async function send() {
            const trip = document.getElementById('tripInput').value;
            if(!trip) return alert('กรุณาระบุเลข Trip');
            const res = await fetch(API, {method:'POST', body: JSON.stringify({action:'Entry', tripNo:trip})});
            alert(await res.text());
            document.getElementById('tripInput').value = '';
        }
    </script>
</body>
</html>
